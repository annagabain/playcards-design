<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />

    <title>Document</title>
  </head>
  <body>
    <main class="table">
      <!-- Card back -->
      <div class="card-back">
        <img src="playcard-deck/card-back.png" alt="card back" />
      </div>

      <!-- Seven cards gallery -->
      <section class="gallery">

                <!-- one css card collage -->
        <div class="playing-card-custom queen-hearts">
          <div class="card-corner card-corner-top">
            <div class="rank">Q</div>
            <div class="suit red-heart">
              <img
                src="playcard-deck/custom-playcard-building-elements/red-heart.png"
                alt="Card Back"
              />
            </div>
          </div>

          <div class="card-content">
            <h2>Queen of Hearts</h2>

            <p>
              She features a red heart suit symbol, a crown indicating
              leadership.
            </p>

            <p>
              Symbolizes emotional intelligence, warmth, empathy, and relational
              depth.
            </p>
          </div>

          <div class="card-corner card-corner-bottom">
            <div class="rank">Q</div>
            <div class="suit red-heart">
              <img
                src="playcard-deck/custom-playcard-building-elements/red-heart.png"
                alt="Card Back"
              />
            </div>
          </div>
        </div>


        <!-- <div class="playing-card">
          <img src="playcard-deck/queen-hearts.png" alt="Queen of Hearts" />
        </div> -->

        <div class="playing-card">
          <img src="playcard-deck/king-hearts.png" alt="King of Hearts" />
        </div>

        <div class="playing-card">
          <img src="playcard-deck/jack-hearts.png" alt="Jack of Hearts" />
        </div>

        <div class="playing-card">
          <img src="playcard-deck/queen-spades.png" alt="Queen of Spadess" />
        </div>

        <div class="playing-card">
          <img src="playcard-deck/king-spades.png" alt="KIng of Spades" />
        </div>

        <div class="playing-card">
          <img src="playcard-deck/jack-spades.png" alt="Jack of Spades" />
        </div>

        <div class="playing-card">
          <img src="playcard-deck/card-back.png" alt="Card Back" />
        </div>

      </section>
    </main>
  </body>
</html>
